<style>
:root{
  --terre:#2B100C;
  --terre2:#48190F;
  --banco:#A8623A;
  --banco2:#7A4226;
  --or:#F3BE49;
  --or-clair:#FFE7A6;
  --or-sombre:#A8760F;
  --indigo:#141E52;
  --indigo2:#33429E;
  --creme:#F8EBD3;
  --vert:#2FA46A;
  --rose:#E2456F;
  --ombre:rgba(20,6,3,.45);
  --serif:'Fraunces', Georgia, 'Times New Roman', serif;
  --sans:'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
:root:not([data-theme="light"]){ color-scheme:dark; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ombre:rgba(0,0,0,.55); } }
:root[data-theme="dark"]{ --ombre:rgba(0,0,0,.55); }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:
    radial-gradient(120% 70% at 50% 0%, #6B2415 0%, var(--terre2) 42%, var(--terre) 100%) fixed;
  color:var(--creme);
  font-family:var(--sans);
  font-size:16px;line-height:1.45;
  display:flex;justify-content:center;
  overflow-x:hidden;
}
#app{width:100%;max-width:440px;min-height:100%;display:flex;flex-direction:column;padding:0 12px 18px;}

/* ---------- barre du royaume ---------- */
.crown{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:8px;
  padding:12px 6px 10px;
  background:linear-gradient(180deg, rgba(43,16,12,.97) 55%, rgba(43,16,12,0));
}
.wordmark{font-family:var(--serif);font-weight:900;font-size:19px;letter-spacing:.01em;margin-right:auto;color:var(--or-clair)}
.wordmark span{display:block;font-family:var(--sans);font-weight:400;font-size:10px;letter-spacing:.14em;color:#C79C7A;margin-top:-3px}
.purse{display:flex;gap:6px}
.coin{
  display:flex;align-items:center;gap:5px;
  background:rgba(0,0,0,.3);border:1px solid rgba(243,190,73,.32);
  border-radius:999px;padding:5px 11px 5px 6px;
  font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;
}
.coin svg{width:17px;height:17px;flex:none}
.coin.bump{animation:bump .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.22)}100%{transform:scale(1)}}

/* ---------- scène du royaume ---------- */
.scene-wrap{position:relative;border-radius:20px;overflow:hidden;box-shadow:0 14px 34px var(--ombre);border:1px solid rgba(243,190,73,.22)}
#scene{display:block;width:100%;height:auto}
.scene-btn{
  position:absolute;right:10px;top:10px;
  background:rgba(20,30,82,.72);color:var(--creme);
  border:1px solid rgba(248,235,211,.28);border-radius:999px;
  font-family:var(--sans);font-size:12px;font-weight:500;padding:7px 12px;cursor:pointer;
  backdrop-filter:blur(6px);
}
.scene-btn:active{transform:scale(.96)}
/* ---------- barre des districts ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 9px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:5px;padding:7px 12px;cursor:pointer;
  background:rgba(0,0,0,.28);border:1px solid rgba(248,235,211,.12);border-radius:999px;
  font-family:var(--sans);font-size:12.5px;font-weight:500;color:#C79C7A;white-space:nowrap}
.tab.on{background:rgba(243,190,73,.14);border-color:rgba(243,190,73,.55);color:var(--or-clair);font-weight:700}
.tab.locked{opacity:.45;cursor:default}
.tab b{font-variant-numeric:tabular-nums;font-weight:700;font-size:11px;opacity:.8}
.dist{display:none}
.dist.on{display:block}

/* ---------- la scène vivante ---------- */
#cam{transform-box:view-box;transform-origin:0 0}
#liveworld{transition:opacity .6s ease,filter .6s ease}
body.ruin #liveworld{opacity:.07;filter:saturate(.08)}
.ruinlayer{opacity:0;transition:opacity .6s ease}
body.ruin .ruinlayer{opacity:1}
#scene .k1,#scene .k2,#scene .k3,#scene .k4,#scene .g1,#scene .g2{transition:stop-color 1.8s ease}
#scene .k1{stop-color:#2A1E6B}#scene .k2{stop-color:#8E3B41}#scene .k3{stop-color:#E0864A}#scene .k4{stop-color:#F8C97E}
#scene .g1{stop-color:#A9613A}#scene .g2{stop-color:#5E2C18}
#scene.era0 .k1{stop-color:#3D3559}#scene.era0 .k2{stop-color:#7C5A52}#scene.era0 .k3{stop-color:#BE9269}#scene.era0 .k4{stop-color:#D9BE95}
#scene.era0 .g1{stop-color:#9C7B5E}#scene.era0 .g2{stop-color:#4F3A2A}
#scene.era2 .k1{stop-color:#1E2A72}#scene.era2 .k2{stop-color:#A03A52}#scene.era2 .k3{stop-color:#F49A46}#scene.era2 .k4{stop-color:#FFE2A4}
#scene.era2 .g1{stop-color:#C0764A}#scene.era2 .g2{stop-color:#6B3520}
#scene.night .k1{stop-color:#080C2A}#scene.night .k2{stop-color:#1B2356}#scene.night .k3{stop-color:#3A3170}#scene.night .k4{stop-color:#6B4A7A}
#scene.night .g1{stop-color:#3A2A3E}#scene.night .g2{stop-color:#1A1020}

/* un bâtiment : caché, en chantier, ou debout */
.bld{opacity:0;visibility:hidden}
.bld.built,.bld.raising{opacity:1;visibility:visible}
.bld .walls,.bld .roof,.bld .orn,.bld .life,.bld .scaf{transform-box:fill-box}
.bld .scaf{opacity:0}
.shadow{fill:#3A1B0C;opacity:.3}

/* la séquence de chantier */
.bld.raising .scaf{transform-origin:50% 100%;animation:scafUp 4.1s ease-out both}
@keyframes scafUp{
  0%{opacity:0;transform:scaleY(0)}
  7%{opacity:.95;transform:scaleY(1)}
  68%{opacity:.95;transform:none}
  100%{opacity:0;transform:translateY(16px) rotate(5deg)}
}
.bld.raising .crew{animation:crewIn 4.1s ease-out both}
@keyframes crewIn{0%{opacity:0}8%{opacity:1}72%{opacity:1}100%{opacity:0}}
.bld.raising .hammer{transform-origin:100% 100%;animation:hammer .42s ease-in-out infinite alternate}
@keyframes hammer{to{transform:rotate(-38deg)}}
.bld.raising .walls{transform-origin:50% 100%;animation:wallUp 1.5s cubic-bezier(.18,1.12,.35,1) .45s both}
@keyframes wallUp{
  0%{transform:scaleY(.015) scaleX(.86);opacity:.35}
  18%{opacity:1}
  100%{transform:none;opacity:1}
}
.bld.raising .roof{animation:roofDrop .8s cubic-bezier(.3,1.7,.45,1) 1.75s both}
@keyframes roofDrop{
  0%{transform:translateY(-78px) scale(.88) rotate(-3deg);opacity:0}
  40%{opacity:1}
  100%{transform:none;opacity:1}
}
.bld.raising .orn{transform-origin:50% 100%;animation:ornPop .7s cubic-bezier(.2,1.8,.4,1) 2.45s both}
@keyframes ornPop{0%{transform:scale(0);opacity:0}55%{transform:scale(1.3);opacity:1}100%{transform:none;opacity:1}}
.bld.raising .life{animation:lifeIn 1s ease-out 2.95s both}
@keyframes lifeIn{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}
.puff{animation:puff 1.5s ease-out both}
@keyframes puff{
  0%{opacity:0;transform:translate(0,0) scale(.25)}
  20%{opacity:.8}
  100%{opacity:0;transform:translate(var(--dx,0px),-30px) scale(2.6)}
}
.scene-wrap.jolt{animation:jolt .34s ease-out}
@keyframes jolt{0%,100%{transform:translateY(0)}30%{transform:translateY(3px)}60%{transform:translateY(-2px)}}

/* cartouche du bâtiment achevé */
#caption{opacity:0;transform:translateY(10px);transform-box:view-box;
  transition:opacity .55s ease,transform .65s cubic-bezier(.2,1.3,.4,1)}
#caption.show{opacity:1;transform:none}

/* vie permanente du royaume */
.leaf{opacity:0;transform:scale(.35);transform-box:fill-box;transform-origin:50% 95%;
  transition:opacity .7s ease,transform .9s cubic-bezier(.2,1.4,.4,1)}
.leaf.on{opacity:1;transform:none}
.leaf.on.sway{animation:sway 5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-1.4deg)}to{transform:rotate(1.4deg)}}
.smoke{transform-box:fill-box;animation:smoke 5.5s linear infinite}
@keyframes smoke{0%{opacity:0;transform:translate(0,0) scale(.5)}25%{opacity:.5}100%{opacity:0;transform:translate(-9px,-34px) scale(2.2)}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flame .38s ease-in-out infinite alternate}
@keyframes flame{to{transform:scaleY(1.25) scaleX(.86)}}
.cloth{transform-box:fill-box;transform-origin:50% 0;animation:cloth 3.2s ease-in-out infinite alternate}
@keyframes cloth{from{transform:rotate(-2.6deg) skewX(-2deg)}to{transform:rotate(2.6deg) skewX(2deg)}}
.shimmer{animation:shimmer 2.4s ease-in-out infinite alternate}
@keyframes shimmer{from{opacity:.35}to{opacity:.9}}
.jet{transform-box:fill-box;animation:jet 1.5s linear infinite}
@keyframes jet{0%{opacity:0;transform:translate(0,0)}20%{opacity:.85}100%{opacity:0;transform:translate(var(--jx,0px),16px)}}
.bucket{transform-box:fill-box;transform-origin:50% 0;animation:bucket 3.6s ease-in-out infinite alternate}
@keyframes bucket{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.cloud{animation:drift 74s linear infinite}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(460px)}}
.bird{animation:flyby 19s linear infinite}
@keyframes flyby{
  0%{transform:translate(-40px,46px) scale(.7);opacity:0}
  12%{opacity:.75}
  88%{opacity:.75}
  100%{transform:translate(440px,10px) scale(1.05);opacity:0}
}
.b2{animation-duration:24s;animation-delay:-7s}
.b3{animation-duration:16s;animation-delay:-13s}
.walkers{opacity:0;transition:opacity 1.2s ease}
#scene.busy .walkers{opacity:1}
.walker{animation:walk 26s linear infinite}
@keyframes walk{
  0%{transform:translate(-30px,40px) scale(.75);opacity:0}
  10%{opacity:1}
  90%{opacity:1}
  100%{transform:translate(300px,-18px) scale(1.05);opacity:0}
}
.w2{animation-duration:34s;animation-delay:-11s}
.w3{animation-duration:29s;animation-delay:-22s;animation-direction:reverse}
.bob{transform-box:fill-box;animation:bob .5s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-1.4px)}}
#lanterns{opacity:0;transition:opacity 1s ease}
#scene.finale #lanterns{opacity:1}
#scene.finale .lant{animation:lant 9s ease-in infinite}
@keyframes lant{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-150px);opacity:0}}

/* ---------- parchemin de dialogue ---------- */
.gongo{
  display:flex;gap:10px;align-items:flex-start;
  margin:14px 2px 4px;padding:11px 13px;
  background:linear-gradient(180deg, rgba(20,30,82,.55), rgba(20,30,82,.3));
  border:1px solid rgba(243,190,73,.2);border-left:3px solid var(--or);
  border-radius:4px 14px 14px 4px;
}
.gongo svg{width:30px;height:30px;flex:none;margin-top:1px}
.gongo p{margin:0;font-size:14px;color:#F3DFC2}
.gongo b{font-family:var(--serif);font-weight:700;color:var(--or)}

/* ---------- chantiers ---------- */
h2.sect{font-family:var(--serif);font-weight:700;font-size:16px;margin:18px 4px 9px;color:var(--or-clair)}
.site{
  display:flex;align-items:center;gap:11px;
  padding:11px 12px;margin-bottom:7px;
  background:rgba(0,0,0,.24);border:1px solid rgba(248,235,211,.1);
  border-radius:13px;
}
.site.done{border-color:rgba(47,164,106,.45);background:rgba(47,164,106,.1)}
.site.next{border-color:rgba(243,190,73,.5);background:rgba(243,190,73,.09)}
.site .nm{flex:1;min-width:0}
.site .nm b{display:block;font-family:var(--serif);font-weight:700;font-size:14.5px;color:var(--creme)}
.site .nm i{display:block;font-style:normal;font-size:12px;color:#BE9679;margin-top:1px}
.site .price{display:flex;gap:7px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:#E6C69A}
.site .price em{display:flex;align-items:center;gap:3px;font-style:normal}
.site .price svg{width:14px;height:14px}
.site .price.short{color:#E2456F}
button.build{
  font-family:var(--sans);font-weight:700;font-size:13px;
  border:none;border-radius:10px;padding:9px 13px;cursor:pointer;
  background:linear-gradient(180deg,var(--or-clair),var(--or));color:#4A2E00;
  box-shadow:0 3px 0 var(--or-sombre);
}
button.build:active{transform:translateY(2px);box-shadow:0 1px 0 var(--or-sombre)}
button.build[disabled]{background:rgba(255,255,255,.1);color:#8B705C;box-shadow:none;cursor:default}
.tick{width:22px;height:22px;flex:none;color:var(--vert)}

/* ---------- gros bouton ---------- */
.play{
  display:block;width:100%;margin:16px 0 4px;
  font-family:var(--serif);font-weight:900;font-size:19px;letter-spacing:.01em;
  border:none;border-radius:16px;padding:16px;cursor:pointer;
  background:linear-gradient(180deg,#FFE28A,var(--or) 60%,#D89B16);color:#43290A;
  box-shadow:0 5px 0 #8A6008, 0 12px 26px rgba(0,0,0,.35);
}
.play:active{transform:translateY(3px);box-shadow:0 2px 0 #8A6008,0 8px 18px rgba(0,0,0,.35)}
.play small{display:block;font-family:var(--sans);font-weight:500;font-size:12px;opacity:.75;letter-spacing:0}

/* ---------- écran de jeu ---------- */
.hud{display:flex;align-items:center;gap:9px;margin:4px 2px 11px}
.moves{
  position:relative;width:62px;height:62px;flex:none;
  display:grid;place-items:center;border-radius:50%;
  background:radial-gradient(circle at 34% 28%, #3C4FD1, #141E52 70%);
  border:2px solid var(--or);box-shadow:0 5px 16px rgba(0,0,0,.4);
}
.moves b{font-family:var(--serif);font-weight:900;font-size:25px;line-height:1;color:var(--or-clair)}
.moves i{position:absolute;bottom:7px;font-style:normal;font-size:8.5px;letter-spacing:.09em;color:#A8B0E8}
.moves.low{border-color:var(--rose);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(226,69,111,.16)}}
.goals{display:flex;gap:7px;flex:1;flex-wrap:wrap}
.goal{
  display:flex;align-items:center;gap:6px;padding:5px 10px 5px 5px;
  background:rgba(0,0,0,.3);border:1px solid rgba(248,235,211,.14);border-radius:12px;
  font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;
}
.goal svg{width:24px;height:24px}
.goal.met{border-color:rgba(47,164,106,.55);background:rgba(47,164,106,.14);color:#8CE3B4}
.quit{background:none;border:none;color:#BE9679;font-family:var(--sans);font-size:13px;cursor:pointer;padding:6px}

#board{
  position:relative;width:100%;aspect-ratio:1;
  background:
    radial-gradient(90% 90% at 50% 12%, rgba(60,79,209,.22), transparent 70%),
    linear-gradient(180deg,#20123C,#170D28);
  border:2px solid rgba(243,190,73,.38);border-radius:18px;
  box-shadow:inset 0 3px 26px rgba(0,0,0,.6), 0 14px 32px var(--ombre);
  overflow:hidden;touch-action:none;
}
#board::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.14;
  background-image:radial-gradient(circle, rgba(243,190,73,.9) 1px, transparent 1.4px);
  background-size:26px 26px;
}
.tile,.blk{position:absolute;left:0;top:0;will-change:transform}
.tile{transition:transform .26s cubic-bezier(.3,.9,.4,1), opacity .2s ease;cursor:pointer}
.face{
  position:absolute;inset:8%;border-radius:26%;
  display:grid;place-items:center;
  box-shadow:inset 0 -2px 4px rgba(0,0,0,.28), inset 0 2px 3px rgba(255,255,255,.4), 0 2px 4px rgba(0,0,0,.3);
}
.face svg{width:78%;height:78%}
.tile.sel .face{outline:3px solid var(--or-clair);outline-offset:1px}
.tile.sel{transform-origin:center;animation:wob .5s infinite}
@keyframes wob{50%{filter:brightness(1.18)}}
.tile.pop{animation:pop .24s ease-in forwards;pointer-events:none}
@keyframes pop{to{opacity:0;filter:brightness(2.2)}}
.face.boost{box-shadow:inset 0 -2px 4px rgba(0,0,0,.3), inset 0 2px 3px rgba(255,255,255,.55), 0 0 12px rgba(243,190,73,.6)}
.face.orb{background:conic-gradient(#F3BE49,#E2456F,#33429E,#2FA46A,#F3BE49)}
.blk{display:grid;place-items:center;pointer-events:none}
.blk svg{width:84%;height:84%}
.sand{position:absolute;pointer-events:none;border-radius:22%;
  background:repeating-linear-gradient(48deg, rgba(198,176,146,.92), rgba(198,176,146,.92) 4px, rgba(166,144,118,.92) 4px, rgba(166,144,118,.92) 8px);
  box-shadow:inset 0 0 8px rgba(0,0,0,.5);}
.fx{position:absolute;pointer-events:none;border-radius:50%;background:radial-gradient(circle, rgba(255,240,190,.95), rgba(243,190,73,0) 70%);animation:fx .42s ease-out forwards}
@keyframes fx{from{transform:scale(.3);opacity:1}to{transform:scale(1.9);opacity:0}}

.tips{margin:11px 2px 0;font-size:13px;color:#C79C7A;text-align:center;min-height:19px}

/* ---------- superposition ---------- */
.veil{
  position:fixed;inset:0;z-index:60;display:none;
  align-items:center;justify-content:center;padding:22px;
  background:rgba(20,6,3,.78);backdrop-filter:blur(5px);
}
.veil.on{display:flex}
.card{
  width:100%;max-width:330px;text-align:center;
  background:linear-gradient(180deg,#5A2314,#361109);
  border:1px solid rgba(243,190,73,.42);border-radius:22px;padding:24px 20px 20px;
  box-shadow:0 22px 50px rgba(0,0,0,.6);
  animation:rise .35s cubic-bezier(.2,1.3,.4,1);
}
@keyframes rise{from{transform:translateY(22px) scale(.95);opacity:0}}
.card h3{font-family:var(--serif);font-weight:900;font-size:24px;margin:8px 0 5px;color:var(--or-clair)}
.card p{margin:0 0 15px;font-size:14px;color:#E0BE9C}
.loot{display:flex;justify-content:center;gap:14px;margin:14px 0 18px}
.loot div{display:flex;align-items:center;gap:6px;font-family:var(--serif);font-weight:900;font-size:21px;color:var(--or-clair)}
.loot svg{width:26px;height:26px}
.card button{display:block;width:100%;margin-top:8px;font-family:var(--sans);font-weight:700;font-size:15px;border:none;border-radius:13px;padding:14px;cursor:pointer}
.b-gold{background:linear-gradient(180deg,#FFE28A,var(--or));color:#43290A;box-shadow:0 4px 0 #8A6008}
.b-gold:active{transform:translateY(2px);box-shadow:0 2px 0 #8A6008}
.b-ad{background:rgba(60,79,209,.32);border:1px solid rgba(143,160,255,.5)!important;color:#D6DDFF}
.b-ghost{background:none;color:#C08F6C;font-weight:500!important}
.hearts{display:flex;justify-content:center;gap:5px;margin-bottom:4px}
.hearts svg{width:18px;height:18px}
.hearts .gone{opacity:.22}
.fineprint{font-size:11px;color:#9E7A5E;margin-top:12px;line-height:1.4}

/* ---------- effets ---------- */
#fx{position:absolute;inset:0;pointer-events:none;z-index:8}
#board.shk{animation:shk .3s}
#board.shk2{animation:shk2 .46s}
@keyframes shk{0%,100%{transform:translate(0,0)}20%{transform:translate(-4px,3px)}45%{transform:translate(4px,-3px)}70%{transform:translate(-2px,-2px)}}
@keyframes shk2{0%,100%{transform:translate(0,0)}12%{transform:translate(-9px,5px) rotate(-.6deg)}30%{transform:translate(9px,-6px) rotate(.6deg)}52%{transform:translate(-6px,-4px)}75%{transform:translate(5px,4px)}}
.pop-txt{
  position:absolute;z-index:12;pointer-events:none;
  font-family:var(--serif);font-weight:900;color:var(--or-clair);
  text-shadow:0 2px 0 #7A4E02, 0 0 20px rgba(243,190,73,.85);
  white-space:nowrap;animation:popTxt 1s cubic-bezier(.2,1.3,.4,1) forwards;
}
@keyframes popTxt{
  0%{transform:translate(-50%,-50%) scale(.35);opacity:0}
  22%{transform:translate(-50%,-58%) scale(1.18);opacity:1}
  70%{transform:translate(-50%,-72%) scale(1);opacity:1}
  100%{transform:translate(-50%,-108%) scale(.9);opacity:0}
}
.flyer{position:fixed;z-index:80;width:26px;height:26px;pointer-events:none;
  transition:transform .72s cubic-bezier(.45,0,.22,1), opacity .22s ease .54s}
.flyer svg{width:100%;height:100%;filter:drop-shadow(0 0 8px rgba(243,190,73,.95))}
.snd{background:rgba(0,0,0,.3);border:1px solid rgba(243,190,73,.32);border-radius:999px;
  width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--or);padding:0;flex:none}
.snd svg{width:18px;height:18px}
.snd.off{color:#8B705C;border-color:rgba(248,235,211,.14)}
.tile.sel .face{animation:selGlow .85s ease-in-out infinite alternate}
@keyframes selGlow{to{box-shadow:inset 0 -2px 4px rgba(0,0,0,.28),inset 0 2px 3px rgba(255,255,255,.45),0 0 18px rgba(255,231,166,.95)}}

.code{
  width:100%;min-height:74px;margin:6px 0 2px;padding:10px;
  background:rgba(0,0,0,.35);border:1px solid rgba(243,190,73,.3);border-radius:10px;
  color:var(--creme);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;
  line-height:1.4;word-break:break-all;resize:none;
}
.card .row{display:flex;gap:8px}
.card .row button{flex:1}

/* ---------- zones système (encoche, barre d'état, barre de navigation) ---------- */
/* Dans l'APK, Capacitor écarte déjà la WebView des barres : ces valeurs y valent 0.
   Elles protègent la version web et les appareils où la marge native ne s'applique pas. */
.crown{padding-top:calc(12px + env(safe-area-inset-top, 0px))}
#app{padding-bottom:calc(18px + env(safe-area-inset-bottom, 0px));
     padding-left:calc(12px + env(safe-area-inset-left, 0px));
     padding-right:calc(12px + env(safe-area-inset-right, 0px))}
.veil{padding:calc(22px + env(safe-area-inset-top, 0px)) 22px calc(22px + env(safe-area-inset-bottom, 0px))}

.hide{display:none!important}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.06s!important}
}
:focus-visible{outline:3px solid var(--or-clair);outline-offset:2px}
</style>
</head>

<div id="app">

  <div class="crown">
    <div class="wordmark">Sankofa Royale<span>Akoma renaît</span></div>
    <div class="purse">

      <div class="coin" id="c-bois"><svg viewBox="0 0 40 40"><rect x="7" y="15" width="26" height="10" rx="5" fill="#A8623A"/><ellipse cx="33" cy="20" rx="4" ry="5" fill="#C98055"/><path d="M33 17v6" stroke="#6B3A1E" stroke-width="1.6"/></svg><span>0</span></div>
    </div>
    <button class="snd" id="sndBtn" type="button" aria-label="Activer ou couper le son"></button>
    <button class="snd" id="saveBtn" type="button" aria-label="Sauvegarder ou restaurer la progression"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg></button>
  </div>

  <!-- ============ LE ROYAUME ============ -->
  <section id="village">
    <div class="tabs" id="tabs"></div>
    <div class="scene-wrap">
      <svg id="scene" viewBox="0 0 400 250" role="img" aria-label="Le royaume d'Akoma">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop class="k1" offset="0"/><stop class="k2" offset=".40"/><stop class="k3" offset=".72"/><stop class="k4" offset="1"/>
          </linearGradient>
          <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
            <stop class="g1" offset="0"/><stop class="g2" offset="1"/>
          </linearGradient>
          <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#7E4526"/><stop offset=".34" stop-color="#D8A06C"/>
            <stop offset=".68" stop-color="#B0713F"/><stop offset="1" stop-color="#6E3A1E"/>
          </linearGradient>
          <linearGradient id="wall2" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#8A5230"/><stop offset=".42" stop-color="#E4AE78"/><stop offset="1" stop-color="#7A4526"/>
          </linearGradient>

          </linearGradient>

          <radialGradient id="vig" cx=".5" cy=".46" r=".74">
            <stop offset=".5" stop-color="#2B0F06" stop-opacity="0"/><stop offset="1" stop-color="#2B0F06" stop-opacity=".6"/>
          </radialGradient>
          <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3"/><feColorMatrix type="saturate" values="0"/></filter>
        </defs>

        <g id="cam">
          <rect x="-300" y="-220" width="1000" height="700" fill="url(#sky)"/>
          <circle cx="322" cy="150" r="74" fill="url(#sunglow)"/>
          <circle cx="322" cy="152" r="23" fill="#FFE6AC"/>

          <g fill="#FFD9A8" opacity=".3">
            <g class="cloud"><ellipse cx="40" cy="40" rx="27" ry="6.5"/><ellipse cx="58" cy="36" rx="17" ry="5.5"/><ellipse cx="24" cy="37" rx="13" ry="4.5"/></g>
            <g class="cloud" style="animation-duration:98s;animation-delay:-40s"><ellipse cx="210" cy="24" rx="33" ry="6"/><ellipse cx="232" cy="21" rx="19" ry="4.6"/></g>
            <g class="cloud" style="animation-duration:120s;animation-delay:-75s"><ellipse cx="140" cy="58" rx="22" ry="4.6"/></g>

          <g stroke="#3A1F14" stroke-width="1.3" fill="none" stroke-linecap="round" opacity=".7">

          <path d="M-60 166c44-27 82-7 124-17s72-31 122-21 84 17 148 5v62H-60z" fill="#8A4A2C" opacity=".45"/>

          <path d="M-20 256C64 226 104 212 156 198s74-13 118-17" stroke="#E7BB8E" stroke-width="5" fill="none" opacity=".28" stroke-linecap="round"/>

          <!-- ruines : l'état de départ -->
          <g class="ruinlayer">
            <g fill="#6B5648">
              <path d="M96 180v-26l10 3v10h8v13z"/><path d="M186 180v-34l13 4v13h7v17z"/>
              <path d="M292 180v-19l9 3v8h7v8z"/><path d="M50 180v-14l8 2v12z"/>
              <path d="M146 180v-21l9 3v18z" opacity=".75"/><path d="M236 180v-16l7 2v14z" opacity=".7"/>

            </g>

              <path d="M78 180l26-5 3 5z"/><path d="M204 180l30-6 4 6z"/><path d="M300 180l22-4 3 4z"/>

            <path d="M120 176l44-4" stroke="#6B5648" stroke-width="3.4" stroke-linecap="round" opacity=".7"/>
            <path d="M250 178l30-3" stroke="#6B5648" stroke-width="2.6" stroke-linecap="round" opacity=".6"/>
          </g>

          <g id="liveworld">
            <g class="dist on" data-d="0">

<script>
"use strict";
(function(){
const W=8,H=8;
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=n=>Math.floor(Math.random()*n);
const K=(r,c)=>r+","+c;
const UN=k=>k.split(",").map(Number);
const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const T=f=>reduce?Math.min(f,60):f;

/* ================= SON ================= */
/* Tout est synthétisé dans le navigateur : aucun fichier audio, aucune requête. */
const SFX={ctx:null,bus:null,verb:null,on:true,timer:null,nb:null};
try{ SFX.on=localStorage.getItem("sankofa.snd")!=="0"; }catch(e){}

function audio(){
  if(SFX.ctx){ if(SFX.ctx.state==="suspended") SFX.ctx.resume(); return SFX.ctx; }
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
  SFX.ctx=new AC();
  SFX.bus=SFX.ctx.createGain(); SFX.bus.gain.value=.5; SFX.bus.connect(SFX.ctx.destination);

function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }

function thin(pat,keep,r){                     // allège un motif pour les niveaux faciles
  return pat.map(row=>[...row].map(ch=>(ch==="X"&&r()>keep)?".":ch).join(""));
}
function countX(lay,ch){ let n=0; lay.forEach(r=>[...r].forEach(c=>{if(c===ch)n++;})); return n; }

/* Les cinq premiers niveaux sont écrits à la main : ils enseignent une mécanique chacun. */
const TUTORIALS=[
 {mv:20, goals:[{k:"tile",t:0,need:12}], rw:{ca:3,bo:1},
  tip:"Alignez trois cauris ou plus. Quatre en ligne forgent une Flèche de Chasse."},

  tip:"Cinq en ligne ouvrent la Calebasse Céleste : elle balaie toute une couleur."},

  goals:[{k:"blk",t:"ronce",need:12}], rw:{ca:4,bo:1},
  tip:"Arrachez les douze ronces. Elles cèdent à une combinaison juste à côté d'elles."},
 {mv:24, lay:["........","........",".PP..PP.",".PP..PP.","........","........","........","........"],
  goals:[{k:"blk",t:"pierre",need:8}], rw:{ca:4,bo:2},
  tip:"Les pierres sacrées ont deux couches. Il faut les frapper deux fois."},
 {mv:24, lay:["........",".SSSSSS.",".S....S.",".S....S.",".S....S.",".SSSSSS.","........","........"],
  goals:[{k:"sand",need:18},{k:"tile",t:2,need:14}], rw:{ca:5,bo:2},
  tip:"Le sable du Harmattan fige les pièces. Une combinaison voisine le balaie."}
];

function fitCount(ch,target,r){          // ajuste un motif au nombre d'obstacles voulu
  let best=null;
  for(let try_=0; try_<5; try_++){
    let pat=PATTERNS[Math.floor(r()*PATTERNS.length)].map(row=>row.replace(/X/g,ch));
    let cells=[];
    pat.forEach((row,y)=>[...row].forEach((c,x)=>{
      if(c===ch){ const open=(y>0)+(y<7)+(x>0)+(x<7); cells.push([y,x,open+r()*0.5]); }
    }));
    if(cells.length<target*0.55){ if(!best) best=[pat,cells.length]; continue; }
    cells.sort((a,b)=>a[2]-b[2]);            // les moins accessibles partent en premier
    while(cells.length>target){
      const [y,x]=cells.shift();
      pat[y]=pat[y].substring(0,x)+"."+pat[y].substring(x+1);
    }
    return [pat,cells.length];
  }
  return best||[PATTERNS[0].map(row=>row.replace(/X/g,ch)),countX(PATTERNS[0].map(row=>row.replace(/X/g,ch)),ch)];
}
const ARCH=["1couleur","2couleurs","ronce","pierre","sable","mixte"];
function levelAt(n){
  if(n<=TUTORIALS.length) return TUTORIALS[n-1];
  const r=rng(n*2654435761>>>0);
  const t=Math.min(1,(n-6)/460);
  const royal=n%15===0;
  const gate=GATES.includes(n);

  let pool=["1couleur","1couleur","2couleurs","ronce","pierre"];
  if(n>=12) pool.push("sable");
  if(n>=25) pool.push("mixte","2couleurs");
  if(n>=60) pool.push("mixte","ronce","pierre","sable");
  const arch=pool[Math.floor(r()*pool.length)];

  const L={goals:[],rw:{},tip:""};
  const needCol=()=>Math.round(11+t*15+r()*4);
  const pick=()=>Math.floor(r()*6);

  if(arch==="1couleur"||arch==="2couleurs"){
    const a=pick(); const b=(a+1+Math.floor(r()*5))%6;
    L.goals.push({k:"tile",t:a,need:needCol()});
    if(arch==="2couleurs") L.goals.push({k:"tile",t:b,need:Math.round(needCol()*.85)});
    const total=L.goals.reduce((s,g)=>s+g.need,0);
    // une seule couleur : seul un tirage sur six compte, il faut bien plus de coups
    L.mv=Math.round(arch==="2couleurs" ? total*(0.68-t*0.19)+2 : total*(1.30-t*0.28)+2);
    L.tip=arch==="2couleurs"?"Deux récoltes à mener de front.":"Une seule couleur, mais il en faut beaucoup.";
  } else {
    const which = arch==="mixte" ? ["ronce","pierre","sable"][Math.floor(r()*3)] : arch;
    const ch={ronce:"R",pierre:"P",sable:"S"}[which];
    const target = which==="pierre" ? Math.round(4+t*6)
                 : which==="ronce"  ? Math.round(7+t*11)
                 :                    Math.round(8+t*14);
    const [pat,cnt]=fitCount(ch,target,r);
    L.lay=pat;
    if(ch==="S") L.goals.push({k:"sand",need:cnt});
    else L.goals.push({k:"blk",t:which,need:cnt});
    L.mv = which==="pierre" ? Math.round(cnt*(2.75-t*.55)+5)
         : which==="ronce"  ? Math.round(cnt*(0.94-t*.30)+3)
         :                    Math.round(cnt*(0.92-t*.26)+4);
    if(arch==="mixte"){ const c=pick();
      const extra=Math.round(8+t*6);
      L.goals.push({k:"tile",t:c,need:extra});
      L.mv+=Math.round(extra*1.3); }
    L.tip={ronce:"Les ronces reculent devant une combinaison voisine.",
           pierre:"Visez les pierres avec un booster, le contact simple ne suffit pas.",
           sable:"Balayez le sable avant qu'il ne fige tout le plateau."}[which];
  }
  if(n>=20&&r()<.16+t*.20) L.spread=true;
  if(royal){ L.royal=true; L.mv=Math.round(L.mv*.88); L.tip="Niveau royal. Trois fois la récompense, et pas un coup de trop."; }
  if(gate) L.gate=true;

  L.mv=Math.max(12,Math.min(44,L.mv));
  const base=3+Math.floor(n/10);
  L.rw={ca:royal?base*3:base, bo:(1+Math.floor(n/25))*(royal?2:1)};
  return L;
}

    const doc=new DOMParser().parseFromString('<svg xmlns="http://www.w3.org/2000/svg">'+out+'</svg>',"image/svg+xml");
    if(doc.querySelector("parsererror")) throw new Error("svg");

function newTile(t){ return {id:uid++, type:(t===undefined?rnd(6):t), b:null}; }
function cell(r,c){ return (r>=0&&r<H&&c>=0&&c<W)?grid[r][c]:null; }
function playable(r,c){ const x=cell(r,c); return x&&x.tile&&!x.sand&&!x.blk; }

function startLevel(){
  lvl=levelAt(S.lvl); moves=lvl.mv; adUsed=false;
  prog=lvl.goals.map(g=>Object.assign({},g,{got:0}));
  grid=[];
  for(let r=0;r<H;r++){ const row=[]; for(let c=0;c<W;c++){
    const ch=lvl.lay?lvl.lay[r][c]:".";
    const o={tile:null,blk:null,sand:false};
    if(ch==="R") o.blk={k:"ronce",hp:1};
    else if(ch==="P") o.blk={k:"pierre",hp:2};
    else { o.tile=newTile(); if(ch==="S") o.sand=true; }
    row.push(o);
  } grid.push(row); }
  // garde-fou : ronces, pierres et sable ne réapparaissent jamais.
  // Un objectif qui en demande plus que le plateau n'en contient rend le niveau impossible.
  const stock={ronce:0,pierre:0,sand:0};
  for(let r=0;r<H;r++)for(let c=0;c<W;c++){
    const x=grid[r][c];
    if(x.blk) stock[x.blk.k]=(stock[x.blk.k]||0)+1;
    if(x.sand) stock.sand++;
  }
  prog=prog.filter(p=>{
    if(p.k!=="blk"&&p.k!=="sand") return true;
    const have=p.k==="sand"?stock.sand:(stock[p.t]||0);
    if(!have) return false;
    if(p.need>have) p.need=have;
    return true;
  });
  if(!prog.length) prog=[{k:"tile",t:0,need:10,got:0}];
  // pas de combinaison au départ
  let guard=0;
  while(findGroups().length&&guard++<300){
    findGroups().forEach(g=>g.cells.forEach(k=>{const[r,c]=UN(k); if(grid[r][c].tile) grid[r][c].tile=newTile();}));
  }
  while(!hasMove()&&guard++<320) shuffle();

  nodes.forEach(n=>n.remove()); nodes.clear();
  $("#village").classList.add("hide"); $("#game").classList.remove("hide");
  onVillage=false; ambient(false);
  FX.ps.length=0;
  $("#tip").textContent=lvl.tip||"";
  sel=null; busy=false;
  sizeBoard(); drawHud();
  window.scrollTo(0,0);
}

/* ---------- combinaisons ---------- */
function findGroups(){
  const runs=[];
  for(let r=0;r<H;r++){ let c=0; while(c<W){
    if(!playable(r,c)){c++;continue;}
    const t=grid[r][c].tile.type; let e=c;
    while(e+1<W&&playable(r,e+1)&&grid[r][e+1].tile.type===t) e++;
    if(e-c+1>=3){ const cc=[]; for(let i=c;i<=e;i++) cc.push(K(r,i)); runs.push({d:"h",t,cells:cc}); }
    c=e+1;
  }}
  for(let c=0;c<W;c++){ let r=0; while(r<H){
    if(!playable(r,c)){r++;continue;}
    const t=grid[r][c].tile.type; let e=r;
    while(e+1<H&&playable(e+1,c)&&grid[e+1][c].tile.type===t) e++;
    if(e-r+1>=3){ const cc=[]; for(let i=r;i<=e;i++) cc.push(K(i,c)); runs.push({d:"v",t,cells:cc}); }
    r=e+1;
  }}
  const groups=[];
  runs.forEach(run=>{
    const hit=groups.find(g=>g.t===run.t&&run.cells.some(k=>g.cells.has(k)));
    if(hit){ run.cells.forEach(k=>hit.cells.add(k)); hit.runs.push(run); }
    else groups.push({t:run.t,cells:new Set(run.cells),runs:[run]});
  });
  let merged=true;
  while(merged){ merged=false;
    for(let i=0;i<groups.length&&!merged;i++)for(let j=i+1;j<groups.length&&!merged;j++){
      if(groups[i].t!==groups[j].t)continue;
      if([...groups[j].cells].some(k=>groups[i].cells.has(k))){
        groups[j].cells.forEach(k=>groups[i].cells.add(k));
        groups[i].runs=groups[i].runs.concat(groups[j].runs);
        groups.splice(j,1); merged=true;
      }
    }
  }
  return groups.map(g=>({t:g.t,runs:g.runs,cells:[...g.cells]}));
}
function boosterFor(g,swap){
  const hasH=g.runs.some(r=>r.d==="h"), hasV=g.runs.some(r=>r.d==="v");
  const n=g.cells.length;
  let kind=null;
  if(hasH&&hasV) kind = n>=6 ? "drum" : "mask";
  else if(n>=5) kind="orb";
  else if(n===4) kind = g.runs[0].d==="h" ? "ah" : "av";
  if(!kind) return null;
  let key=null;
  if(swap) key=swap.find(k=>g.cells.includes(k))||null;
  if(!key&&hasH&&hasV){
    key=g.cells.find(k=>{const[r,c]=UN(k);
      return g.runs.some(x=>x.d==="h"&&x.cells.includes(k))&&g.runs.some(x=>x.d==="v"&&x.cells.includes(k));});
  }
  if(!key) key=g.cells[Math.floor(g.cells.length/2)];
  return {key,kind,type:g.t};
}
function areaOf(r,c,kind){
  const out=[];
  if(kind==="ah") for(let i=0;i<W;i++) out.push(K(r,i));
  else if(kind==="av") for(let i=0;i<H;i++) out.push(K(i,c));
  else if(kind==="mask"){ for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++) if(cell(r+dr,c+dc)) out.push(K(r+dr,c+dc)); }
  else if(kind==="drum"){
    out.push(K(r,c));
    for(let n=0;n<3;n++){ const rr=rnd(H),cc=rnd(W);
      for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++) if(cell(rr+dr,cc+dc)) out.push(K(rr+dr,cc+dc)); }
  }
  else if(kind==="orb"){
    const t=rnd(6);
    for(let i=0;i<H;i++)for(let j=0;j<W;j++) if(playable(i,j)&&grid[i][j].tile.type===t) out.push(K(i,j));
    out.push(K(r,c));
  }
  return out;
}
function countGoal(kind,t){
  prog.forEach(p=>{
    if(kind==="tile"&&p.k==="tile"&&p.t===t) p.got++;
    if(kind==="blk"&&p.k==="blk"&&p.t===t) p.got++;
    if(kind==="sand"&&p.k==="sand") p.got++;
  });
}
async function clearSet(set){
  const done=new Set(), q=[...set];
  while(q.length){
    const k=q.pop(); if(done.has(k))continue; done.add(k);
    const [r,c]=UN(k); const x=cell(r,c); if(!x)continue;
    if(x.tile&&x.tile.b&&!x.sand){
      const kind=x.tile.b; x.tile.b=null;
      boostFX(r,c,kind);
      areaOf(r,c,kind).forEach(k2=>{ if(!done.has(k2)) q.push(k2); });
    }
  }
  const dmg=new Set();
  done.forEach(k=>{ const[r,c]=UN(k); const x=cell(r,c);
    if(x&&x.tile&&!x.sand){ [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dr,dc])=>{
      const y=cell(r+dr,c+dc), kk=K(r+dr,c+dc);
      if(y&&(y.blk||y.sand)&&!done.has(kk)) dmg.add(kk); }); }
  });
  let any=false,nT=0,nS=0,nR=0,nP=0;
  done.forEach(k=>{
    const [r,c]=UN(k); const x=cell(r,c); if(!x)return;
    if(x.blk){ if(x.blk.k==="ronce")nR++; else nP++; hitBlock(r,c); any=true; return; }
    if(x.sand){ x.sand=false; countGoal("sand"); flash(r,c,"#D9C4A0"); nS++; any=true; return; }
    if(x.tile){ countGoal("tile",x.tile.type); flash(r,c,TYPES[x.tile.type].b); x.tile=null; nT++; any=true; }
  });
  dmg.forEach(k=>{ const[r,c]=UN(k); const x=cell(r,c); if(!x)return;
    if(x.blk){ if(x.blk.k==="ronce")nR++; else nP++; hitBlock(r,c); }
    else if(x.sand){ x.sand=false; countGoal("sand"); flash(r,c,"#D9C4A0"); nS++; }
  });
  if(nT) SND.match(chainNow);
  if(nS) SND.sand();
  if(nR) SND.wood();
  if(nP) SND.stone();
  if(nT>=10) shake(nT>=20);
  return any;
}
function hitBlock(r,c){
  const x=grid[r][c]; if(!x.blk)return;
  const last=x.blk.hp<=1;
  x.blk.hp--;
  flash(r,c, x.blk.k==="ronce"?"#3E8F52":"#A9AFC6", last?12:5);
  if(x.blk.hp<=0){ countGoal("blk",x.blk.k); x.blk=null; }
}
function gravity(){
  for(let c=0;c<W;c++){
    let wr=H-1;
    for(let r=H-1;r>=0;r--){
      const x=grid[r][c];
      if(x.blk){ wr=r-1; continue; }
      if(x.sand&&x.tile){ wr=r-1; continue; }
      if(x.tile){ if(wr!==r){ grid[wr][c].tile=x.tile; x.tile=null; } wr--; }
    }
  }
  for(let c=0;c<W;c++)for(let r=0;r<H;r++){
    const x=grid[r][c]; if(!x.blk&&!x.tile) x.tile=newTile();
  }
}
function spreadRonce(){
  const seeds=[];
  for(let r=0;r<H;r++)for(let c=0;c<W;c++) if(grid[r][c].blk&&grid[r][c].blk.k==="ronce") seeds.push([r,c]);
  if(!seeds.length||seeds.length>22) return false;
  for(let n=0;n<10;n++){
    const [r,c]=seeds[rnd(seeds.length)];
    const [dr,dc]=[[1,0],[-1,0],[0,1],[0,-1]][rnd(4)];
    const y=cell(r+dr,c+dc);
    if(y&&y.tile&&!y.blk&&!y.sand){ y.tile=null; y.blk={k:"ronce",hp:1}; flash(r+dr,c+dc); return true; }
  }
  return false;
}
async function resolve(swap){
  busy=true; let chain=0;
  const met0=prog.map(p=>p.got>=p.need);
  while(true){
    const groups=findGroups();
    if(!groups.length) break;
    chain++; chainNow=chain;
    const boosters=[], toClear=new Set();
    groups.forEach(g=>{
      const b=boosterFor(g,chain===1?swap:null);
      if(b) boosters.push(b);
      g.cells.forEach(k=>toClear.add(k));
    });
    boosters.forEach(b=>toClear.delete(b.key));
    if(chain>=2){
      const any=[...toClear][0];
      if(any){ const[r,c]=UN(any);
        popText(chain>=5?"Tonnerre ×"+chain:"Combo ×"+chain, r, Math.min(Math.max(c,1),W-2),
                Math.round(cs*(chain>=5?.62:.5))); }
    }
    await clearSet(toClear);
    boosters.forEach(b=>{ const[r,c]=UN(b.key); const x=grid[r][c];
      if(x.tile){ x.tile.type=b.type; x.tile.b=b.kind;
        push({k:"ring",x:(c+.5)*cs,y:(r+.5)*cs,r0:cs*.8,r1:cs*.16,lw:4,c:"#FFE7A6",life:18});
        push({k:"wave",x:(c+.5)*cs,y:(r+.5)*cs,r1:cs*1.1,life:20}); } });
    if(boosters.length){ SND.make(); const[br,bc]=UN(boosters[0].key);
      popText(BOOST[boosters[0].kind].nm,br,Math.min(Math.max(bc,2),W-3),Math.round(cs*.3)); }
    drawAll(); await sleep(T(230));
    gravity(); drawAll(); await sleep(T(300));
  }
  chainNow=1;
  prog.forEach((p,i)=>{ if(!met0[i]&&p.got>=p.need) SND.goal(); });
  if(lvl.spread&&moves%4===0&&moves>0){ if(spreadRonce()){ drawAll(); await sleep(T(200)); } }
  let guard=0;
  while(!hasMove()&&guard++<40){ shuffle(); drawAll(); $("#tip").textContent="Plus aucun coup — le plateau se remêle."; await sleep(T(380)); }
  drawHud();
  if(prog.every(p=>p.got>=p.need)) return finish(true);
  if(moves<=0) return finish(false);
  busy=false;
}
function shuffle(){
  const pool=[];
  for(let r=0;r<H;r++)for(let c=0;c<W;c++) if(playable(r,c)) pool.push(grid[r][c].tile.type);
  for(let i=pool.length-1;i>0;i--){ const j=rnd(i+1); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  let i=0;
  for(let r=0;r<H;r++)for(let c=0;c<W;c++) if(playable(r,c)) grid[r][c].tile.type=pool[i++];
}
function hasMove(){
  for(let r=0;r<H;r++)for(let c=0;c<W;c++){
    if(!playable(r,c))continue;
    if(grid[r][c].tile.b) return true;
    for(const [dr,dc] of [[0,1],[1,0]]){
      if(!playable(r+dr,c+dc))continue;
      const a=grid[r][c].tile,b=grid[r+dr][c+dc].tile;
      [a.type,b.type]=[b.type,a.type];
      const ok=findGroups().length>0;
      [a.type,b.type]=[b.type,a.type];
      if(ok) return true;
    }
  }
  return false;
}
function comboOf(a,b){
  const A=grid[a.r][a.c].tile,B=grid[b.r][b.c].tile;
  if(!A.b&&!B.b) return null;
  if(A.b==="orb"&&B.b==="orb") return "wipe";
  if(A.b==="orb"||B.b==="orb"){
    const orb=A.b==="orb"?a:b, other=A.b==="orb"?B:A;
    return {orb,other};
  }
  if(A.b&&B.b) return "pair";
  return null;
}
async function runCombo(a,b,combo){
  const set=new Set();
  if(combo==="wipe"){
    for(let r=0;r<H;r++)for(let c=0;c<W;c++) set.add(K(r,c));
  } else if(combo==="pair"){
    const ka=grid[a.r][a.c].tile.b, kb=grid[b.r][b.c].tile.b;
    const kinds=[ka,kb];
    if(kinds.includes("mask")&&kinds.filter(k=>k==="mask").length===2){
      for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++) if(cell(b.r+dr,b.c+dc)) set.add(K(b.r+dr,b.c+dc));
    } else if(kinds.every(k=>k==="ah"||k==="av")){
      for(let i=0;i<W;i++) set.add(K(b.r,i));
      for(let i=0;i<H;i++) set.add(K(i,b.c));
    } else if(kinds.includes("drum")){
      for(let n=0;n<5;n++){ const rr=rnd(H),cc=rnd(W);
        for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++) if(cell(rr+dr,cc+dc)) set.add(K(rr+dr,cc+dc)); }
      set.add(K(a.r,a.c)); set.add(K(b.r,b.c));
    } else {
      for(let d=-1;d<=1;d++){ for(let i=0;i<W;i++) if(cell(b.r+d,i)) set.add(K(b.r+d,i));
                              for(let i=0;i<H;i++) if(cell(i,b.c+d)) set.add(K(i,b.c+d)); }
    }
    grid[a.r][a.c].tile.b=null; grid[b.r][b.c].tile.b=null;
  } else {
    const t=combo.other.b?null:combo.other.type;
    grid[combo.orb.r][combo.orb.c].tile.b=null;
    if(t===null){
      const k=combo.other.b;
      const tt=rnd(6);
      for(let r=0;r<H;r++)for(let c=0;c<W;c++) if(playable(r,c)&&grid[r][c].tile.type===tt) grid[r][c].tile.b=k;
      for(let r=0;r<H;r++)for(let c=0;c<W;c++) if(playable(r,c)&&grid[r][c].tile.b===k) set.add(K(r,c));
    } else {
      for(let r=0;r<H;r++)for(let c=0;c<W;c++) if(playable(r,c)&&grid[r][c].tile.type===t) set.add(K(r,c));
    }
    set.add(K(combo.orb.r,combo.orb.c));
  }
  await clearSet(set);
  if(combo==="wipe"){ SND.orb(); shake(true);
    push({k:"wave",x:FX.w/2,y:FX.h/2,r1:cs*7,life:34});
    for(let i=0;i<(reduce?8:60);i++){ const a2=Math.random()*6.284, sp=cs*(.05+Math.random()*.22);
      push({k:"spark",x:FX.w/2,y:FX.h/2,vx:Math.cos(a2)*sp,vy:Math.sin(a2)*sp,g:0,
        r:cs*(.04+Math.random()*.09),c:["#F3BE49","#E2456F","#33429E","#2FA46A","#FFE7A6"][rnd(5)],life:30+rnd(22)}); }
  } else shake(true);
  drawAll(); await sleep(T(260));
  gravity(); drawAll(); await sleep(T(300));
  await resolve(null);
}
async function trySwap(a,b){
  if(busy) return;
  if(Math.abs(a.r-b.r)+Math.abs(a.c-b.c)!==1) return;
  if(!playable(a.r,a.c)||!playable(b.r,b.c)) return;
  busy=true; sel=null;
  SND.swap();
  const A=grid[a.r][a.c],B=grid[b.r][b.c];
  const ta=A.tile,tb=B.tile; A.tile=tb; B.tile=ta;
  drawAll(); await sleep(T(210));
  const combo=comboOf(a,b);
  if(combo){ moves--; drawHud();
    popText(combo==="wipe"?"Deux Calebasses !":"Fusion !",b.r,Math.min(Math.max(b.c,2),W-3),Math.round(cs*.42));
    return runCombo(a,b,combo); }
  if(!findGroups().length){
    SND.bad();
    A.tile=ta; B.tile=tb; drawAll(); await sleep(T(210));
    busy=false; return;
  }
  moves--; drawHud();
  await resolve([K(a.r,a.c),K(b.r,b.c)]);
}

/* ---------- saisie ---------- */
let down=null;
function at(e){
  const r=boardEl.getBoundingClientRect();
  const c=Math.floor((e.clientX-r.left)/cs), rr=Math.floor((e.clientY-r.top)/cs);
  if(rr<0||rr>=H||c<0||c>=W) return null;
  return {r:rr,c,x:e.clientX,y:e.clientY};
}
boardEl.addEventListener("pointerdown",e=>{
  if(busy)return; const p=at(e); if(!p)return; down=p;
  if(sel&&Math.abs(sel.r-p.r)+Math.abs(sel.c-p.c)===1){ trySwap(sel,p); down=null; return; }
  sel=playable(p.r,p.c)?{r:p.r,c:p.c}:null; if(sel) SND.tap(); drawAll();
});
boardEl.addEventListener("pointerup",e=>{
  if(!down||busy){down=null;return;}
  const dx=e.clientX-down.x, dy=e.clientY-down.y;
  if(Math.max(Math.abs(dx),Math.abs(dy))>cs*.3){
    const t=Math.abs(dx)>Math.abs(dy)
      ? {r:down.r,c:down.c+(dx>0?1:-1)} : {r:down.r+(dy>0?1:-1),c:down.c};
    sel=null; trySwap({r:down.r,c:down.c},t);
  }
  down=null;
});
boardEl.addEventListener("pointercancel",()=>{down=null;});

/* ---------- fin de niveau ---------- */
async function finish(win){
  busy=true; sel=null;
  let bonus=0;
  if(win&&moves>0){
    $("#tip").textContent="Final Tonnerre !";
    popText("Final Tonnerre",3,3,Math.round(cs*.52));
    const n=Math.min(moves,6);
    for(let i=0;i<n;i++){
      const r=rnd(H),c=rnd(W); const set=new Set();
      for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++) if(cell(r+dr,c+dc)) set.add(K(r+dr,c+dc));
      SND.thunder(); shake(i%2===1);
      push({k:"ring",x:(c+.5)*cs,y:(r+.5)*cs,r0:cs*.2,r1:cs*2,lw:5,c:"#FFE7A6",life:20});
      push({k:"wave",x:(c+.5)*cs,y:(r+.5)*cs,r1:cs*2,life:22});
      await clearSet(set); drawAll(); await sleep(T(150));
      gravity(); drawAll(); await sleep(T(180));
    }
    bonus=Math.floor(moves/4);
    let guard=0; while(findGroups().length&&guard++<12){
      const g=findGroups(); const s=new Set(); g.forEach(x=>x.cells.forEach(k=>s.add(k)));
      await clearSet(s); gravity(); drawAll(); await sleep(T(160));
    }
    moves=0; drawHud();
  }
  if(win){
    const rw=levelAt(S.lvl).rw;
    const ca=rw.ca+bonus, bo=rw.bo;
    S.ca+=ca; S.bo+=bo; S.lvl++; save();
    SND.win();
    fly(ca,ICON.cauris,$("#c-cauris"),120);
    fly(bo,ICON.bois,$("#c-bois"),420);
    await sleep(T(1150));
    $("#c-cauris").querySelector("span").textContent=S.ca;
    $("#c-bois").querySelector("span").textContent=S.bo;
    showCard(`
      <div class="hearts">${hearts()}</div>
      <h3>${lvl.royal?"Niveau royal remporté":"Le sable recule"}</h3>
      <p>Gongo rapporte la récolte au chantier.</p>
      <div class="loot"><div>${ICON.cauris}+${ca}</div><div>${ICON.bois}+${bo}</div></div>
      <button class="b-gold" data-act="village">Aller au royaume</button>`);
  } else {
    const near=prog.reduce((a,p)=>a+Math.max(0,p.need-p.got),0);
    const canAd=!adUsed&&near<=6;
    S.lives=Math.max(0,S.lives-1); save();
    SND.lose();
    showCard(`
      <div class="hearts">${hearts()}</div>
      <h3>Plus de coups</h3>
      <p>${canAd?"Il ne manque presque rien. Gongo peut vous rapporter cinq coups.":"Le Harmattan garde ce terrain pour cette fois."}</p>
      ${canAd?`<button class="b-ad" data-act="ad">Regarder une vidéo · +5 coups</button>`:""}
      ${S.lives>0?`<button class="${canAd?"b-ghost":"b-gold"}" data-act="retry">Recommencer le niveau</button>`:""}
      <button class="b-ghost" data-act="village">Retour au royaume</button>
      ${S.lives===0?`<p class="fineprint">Plus de vies. Dans le jeu final, elles reviennent une par une toutes les vingt minutes — ici, la Cour Royale vous en rend cinq.</p><button class="b-ad" data-act="refill">Récupérer 5 vies</button>`:""}
      <p class="fineprint">Publicité simulée : ce prototype ne charge aucune vraie annonce.</p>`);
  }
}
function hearts(){ let s=""; for(let i=0;i<5;i++) s+=`<span class="${i<S.lives?"":"gone"}">${ICON.heart}</span>`; return s; }
function showCard(html){
  $("#card").innerHTML=html; $("#veil").classList.add("on");
  $("#card").querySelectorAll("button").forEach(b=>b.onclick=()=>{
    const a=b.dataset.act;
    if(a==="copy"){
      const t=$("#codeOut"); t.select(); t.setSelectionRange(0,99999);
      let ok=false;
      try{ ok=document.execCommand("copy"); }catch(e){}
      if(!ok&&navigator.clipboard){ navigator.clipboard.writeText(t.value).catch(()=>{}); ok=true; }
      b.textContent=ok?"Code copié":"Sélectionnez et copiez à la main";
      SND.tap(); return;
    }
    if(a==="reset"){
      if(!b.dataset.armed){
        b.dataset.armed="1"; b.textContent="Toucher encore pour tout effacer";
        b.style.fontWeight="700"; SND.bad();
        setTimeout(()=>{ if(b.isConnected){ delete b.dataset.armed; b.textContent="Recommencer à zéro"; b.style.fontWeight=""; } },4000);
        return;
      }
      $("#veil").classList.remove("on"); resetGame(); SND.tap();
      return;
    }
    if(a==="restore"){
      const v=$("#codeIn").value;
      if(importCode(v)){ $("#veil").classList.remove("on"); SND.goal();
        document.querySelectorAll("#scene .bld").forEach(g=>g.classList.remove("built","raising"));
        if(S.built.length<BUILDINGS.length) $("#scene").classList.remove("finale");
        genDone=false; $("#genDist").textContent=""; building=false; pendingId=null;
        showDist(0); syncRuin(); camReset(0); enterVillage();
        say("Progression restaurée : niveau "+S.lvl+", "+S.built.length+" chantiers debout."); }
      else { b.textContent="Code invalide"; SND.bad(); }
      return;
    }
    act(a);
  });
}
function act(a){
  $("#veil").classList.remove("on"); SND.tap();
  if(a==="village"){ $("#game").classList.add("hide"); $("#village").classList.remove("hide"); onVillage=true; ambient(true); enterVillage(); window.scrollTo(0,0); }
  else if(a==="retry"){ startLevel(); }
  else if(a==="ad"){ adUsed=true; S.lives=Math.min(5,S.lives+1); save(); moves=5; busy=false; drawHud(); SND.goal(); $("#tip").textContent="Cinq coups de plus. Faites-les compter."; }
  else if(a==="refill"){ S.lives=5; save(); startLevel(); }
  else if(a==="close"){ /* rien */ }
}
/* ---------- sauvegarde transférable ---------- */
function exportCode(){
  const o={v:1,lvl:S.lvl,ca:S.ca,bo:S.bo,built:S.built,lives:S.lives,seen:S.seen||[0]};
  try{ return btoa(unescape(encodeURIComponent(JSON.stringify(o)))); }catch(e){ return ""; }
}
function importCode(txt){
  try{
    const o=JSON.parse(decodeURIComponent(escape(atob((txt||"").replace(/\s/g,"")))));
    if(typeof o.lvl!=="number"||!Array.isArray(o.built)) return false;
    const ids=BUILDINGS.map(b=>b.id);
    S.lvl=Math.max(1,Math.round(o.lvl));
    S.ca=Math.max(0,Math.round(o.ca||0));
    S.bo=Math.max(0,Math.round(o.bo||0));
    S.built=o.built.filter(x=>ids.indexOf(x)>=0);
    S.lives=Math.min(5,Math.max(0,Math.round(o.lives==null?5:o.lives)));
    S.seen=Array.isArray(o.seen)?o.seen:[0];
    save(); return true;
  }catch(e){ return false; }
}
function saveCard(){
  const code=exportCode();
  showCard(`<h3>Sauvegarde</h3>
    <p>Niveau ${S.lvl} · ${S.built.length}/${BUILDINGS.length} chantiers</p>
    <textarea class="code" id="codeOut" readonly>${code}</textarea>
    <div class="row"><button class="b-gold" data-act="copy">Copier le code</button></div>
    <p class="fineprint" style="margin-top:14px;text-align:left">Gardez ce code avant de réinstaller
    l'application. Collez-le ci-dessous pour retrouver votre royaume.</p>
    <textarea class="code" id="codeIn" placeholder="Collez un code ici"></textarea>
    <button class="b-ad" data-act="restore">Restaurer</button>
    <button class="b-ghost" data-act="close">Fermer</button>
    <button class="b-ghost" data-act="reset" style="color:#E2456F;margin-top:14px">Recommencer à zéro</button>`);
}
/* Le voile de ruine ne couvre la Cour du Baobab que tant qu'on n'y a rien bâti. */
function syncRuin(){
  const vierge=!S.built.some(id=>BUILDINGS.some(b=>b.id===id&&b.d===0));
  // le voile et les ruines n'appartiennent qu'à la Cour du Baobab
  document.body.classList.toggle("ruin",vierge&&curDist===0);
  $("#beforeBtn").textContent=vierge?"Aujourd'hui":"Il y a cent saisons";
  $("#beforeBtn").style.visibility=curDist===0?"visible":"hidden";
}
/* Remise à zéro complète : état, stockage, scène, districts générés. */
function resetGame(){
  S={lvl:1,ca:0,bo:0,built:[],lives:5,seen:[0]};
  try{ localStorage.removeItem("sankofa.v1"); }catch(e){}
  save();
  document.querySelectorAll("#scene .bld").forEach(g=>g.classList.remove("built","raising"));
  $("#scene").classList.remove("finale");
  $("#genDist").textContent=""; genDone=false;
  building=false; pendingId=null;
  showDist(0); syncRuin(); camReset(0);
  say("Le sable a tout recouvert, princesse. Mais la terre se souvient de nous.");
}
function sndIcon(){ $("#sndBtn").innerHTML=SFX.on?SPK:MUTE; $("#sndBtn").classList.toggle("off",!SFX.on); }
$("#sndBtn").onclick=()=>{
  SFX.on=!SFX.on;
  try{ localStorage.setItem("sankofa.snd",SFX.on?"1":"0"); }catch(e){}
  sndIcon();
  if(SFX.on){ audio(); SND.tap(); if(onVillage) ambient(true); } else ambient(false);
};
$("#saveBtn").onclick=()=>{ SND.tap(); saveCard(); };
sndIcon();
["pointerdown","keydown"].forEach(ev=>window.addEventListener(ev,()=>{
  audio(); if(SFX.on&&onVillage) ambient(true);
},{once:true}));
$("#playBtn").onclick=()=>{
  if(S.lives<=0){ showCard(`<div class="hearts">${hearts()}</div><h3>Plus de vies</h3>
    <p>Dans le jeu final, une vie revient toutes les vingt minutes.</p>
    <button class="b-ad" data-act="refill">Récupérer 5 vies</button>
    <button class="b-ghost" data-act="village">Rester au royaume</button>
    <p class="fineprint">Publicité simulée.</p>`); return; }
  startLevel();
};
$("#quitBtn").onclick=()=>{ SND.tap(); $("#game").classList.add("hide"); $("#village").classList.remove("hide"); onVillage=true; ambient(true); enterVillage(); };

showDist(0);
syncRuin();
})();
</script>
